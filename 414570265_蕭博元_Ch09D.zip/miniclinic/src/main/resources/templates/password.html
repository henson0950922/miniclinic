<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h2 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 12px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input[type="password"]:focus { outline: none; border-color: #14B8A6; box-shadow: 0 0 0 2px rgba(20,184,166,0.2); }
        .error-message { color: #DC2626; font-size: 0.9em; margin-top: 5px; }
        .success-message { background: #D1FAE5; color: #065F46; padding: 12px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #A7F3D0; }
        .btn-group { margin-top: 30px; }
        .btn-submit { background: #0D9488; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background: #0F766E; }
        .btn-cancel { background: #94A3B8; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 16px; margin-left: 10px; }
        .btn-cancel:hover { background: #64748B; }
    </style>
</head>
<body>
    <h2>修改密碼 <span style="font-size: 0.6em; color: #64748B; font-weight: normal;">(<span th:text="${loggedInDoctorName}"></span>醫師)</span></h2>

    <!-- 顯示修改成功訊息 -->
    <div th:if="${param.success}" class="success-message">
        密碼修改成功！
    </div>

    <form th:action="@{/password}" th:object="${passwordForm}" method="post">
        <div class="form-group">
            <label for="oldPassword">舊密碼</label>
            <input type="password" id="oldPassword" th:field="*{oldPassword}" placeholder="請輸入目前的密碼">
            <div class="error-message" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
        </div>

        <div class="form-group">
            <label for="newPassword">新密碼</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" placeholder="至少 8 個字元">
            <div class="error-message" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">確認新密碼</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="請再次輸入新密碼">
            <div class="error-message" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-submit">確認修改</button>
            <a th:href="@{/dashboard}" class="btn-cancel">返回 Dashboard</a>
        </div>
    </form>
</body>
</html>
