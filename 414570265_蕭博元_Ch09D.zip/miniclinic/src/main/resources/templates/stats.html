<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; margin-bottom: 24px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #5EEAD4; }
        .summary { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 20px; }
        .card { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 18px; }
        .card h2 { margin: 0 0 8px; color: #0F2443; }
        .card p { margin: 0; font-size: 1.6rem; font-weight: bold; color: #0F2443; }
        table { width: 100%; border-collapse: collapse; margin-top: 26px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        tr:hover { background: #F8FAFC; }
    </style>
</head>
<body>
    <h1>掛號統計</h1>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師名單</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointments}">掛號列表</a>
        <a th:href="@{/stats}">統計報表</a>
    </nav>

    <div class="summary">
        <div class="card">
            <h2>醫師總數</h2>
            <p th:text="${doctorCount}">0</p>
        </div>
        <div class="card">
            <h2>病患總數</h2>
            <p th:text="${patientCount}">0</p>
        </div>
        <div class="card">
            <h2>掛號總數</h2>
            <p th:text="${appointmentCount}">0</p>
        </div>
    </div>

    <h2>依科別分組的掛號數</h2>
    <table>
        <thead>
            <tr>
                <th>科別</th>
                <th>掛號數</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${appointmentsByDepartment}">
                <td th:text="${entry.key}">內科</td>
                <td th:text="${entry.value}">0</td>
            </tr>
            <tr th:if="${appointmentsByDepartment.isEmpty()}">
                <td colspan="2">目前尚無掛號資料。</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
